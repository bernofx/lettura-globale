name: Pubblica immagini approvate

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-images-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'bernofx/lettura-globale' && github.ref == 'refs/heads/main' && vars.SCHEDULED_IMAGES_PUBLISHER_ENABLED == 'true'
    environment: scheduled-image-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp
      - run: node --experimental-strip-types --import ./tests/helpers/register-ts-resolve.mjs scripts/publish-scheduled-image.mjs
        env:
          GH_TOKEN: ${{ secrets.SCHEDULED_IMAGES_GITHUB_TOKEN }}
          SCHEDULED_IMAGES_PUBLISHER_TOKEN: ${{ secrets.SCHEDULED_IMAGES_PUBLISHER_TOKEN }}
